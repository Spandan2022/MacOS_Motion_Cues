name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: bash -n install.sh && zsh -n start.sh scripts/bundle.sh scripts/package.sh scripts/release.sh

      - name: Build (debug)
        run: swift build

      - name: Automatic-mode scenarios
        run: .build/debug/MotionCues --auto-test

      - name: Build app bundle (release, ad-hoc signed)
        run: scripts/bundle.sh --no-install
